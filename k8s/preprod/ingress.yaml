# pool.ppd.nice-tek.eu, TLS by cert-manager (Let's Encrypt HTTP-01)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pool-tracker-web
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: pool-tracker-preprod-redirect-https@kubernetescrd,pool-tracker-preprod-security-headers@kubernetescrd,pool-tracker-preprod-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pool.ppd.nice-tek.eu
      secretName: pool-tracker-tls-cert
  rules:
    - host: pool.ppd.nice-tek.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pool-tracker-web
                port:
                  name: http
