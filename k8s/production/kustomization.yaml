# Everything the deploy workflow applies: kubectl apply -k k8s/production
# The workflow sets images[].newTag to the deployed commit SHA.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pool-tracker-prod
labels:
  - pairs:
      app.kubernetes.io/part-of: pool-tracker
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true
resources:
  - ../base
  - ingress.yaml
  - db-backup.yaml
# Two web pods in production: a pod restart no longer interrupts the site
replicas:
  - name: pool-tracker-web
    count: 2
images:
  - name: ghcr.io/epitech-nice/pool-tracker
    newTag: latest
