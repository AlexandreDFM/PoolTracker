name: Deploy to Kubernetes

# Called by build.yaml once the image of the commit is pushed.
# Secrets and Variables are repository-level and prefixed per environment:
# PRD_ for production, PPD_ for preprod (e.g. PRD_JWT_SECRET). The GitHub
# environment only records the deployments and their URL.
# One-time setup (namespace, deploy account, cert-manager, Secrets and
# Variables): documentation/DEPLOYMENT.md
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (production or preprod)
        required: true
        type: string
      namespace:
        description: Kubernetes namespace
        required: true
        type: string
      manifests:
        description: Kustomize folder
        required: true
        type: string
      prefix:
        description: Prefix of the environment's Secrets and Variables (PRD or PPD)
        required: true
        type: string

permissions:
  contents: read

env:
  APP: pool-tracker
  PREFIX: ${{ inputs.prefix }}
  NAMESPACE: ${{ inputs.namespace }}
  MANIFESTS: ${{ inputs.manifests }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars[format('{0}_PUBLIC_SITE_URL', inputs.prefix)] }}
    # One deployment at a time per environment; a newer one waits
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Connect to the cluster
        env:
          KUBE_CONFIG: ${{ secrets[format('{0}_KUBE_CONFIG', inputs.prefix)] }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::Secret ${PREFIX}_KUBE_CONFIG is missing (k8s/rbac/make-kubeconfig.sh)"
            exit 1
          fi
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          KUBECONFIG="$kubeconfig" kubectl -n "$NAMESPACE" auth can-i create deployments.apps \
            || { echo "::error::The deploy account cannot deploy in $NAMESPACE (k8s/rbac/deployer*.yaml)"; exit 1; }

      - name: Check the one-time setup
        run: |
          # Every kind the manifests use must be allowed to the deploy account,
          # or apply fails half-way. The TLS certificate is created by cert-manager.
          missing=0
          for kind in persistentvolumeclaims services configmaps secrets deployments.apps \
                      ingresses.networking.k8s.io middlewares.traefik.io cronjobs.batch; do
            if ! kubectl -n "$NAMESPACE" auth can-i patch "$kind" > /dev/null; then
              echo "::error::The deploy account cannot manage $kind in $NAMESPACE (k8s/rbac/)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Registry access (private package only)
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER || github.repository_owner }}
        run: |
          # The pull secret must outlive the run: the kubelet pulls again when a
          # pod is recreated, and GITHUB_TOKEN expires with the job
          if [ -n "$GHCR_PULL_TOKEN" ]; then
            kubectl -n "$NAMESPACE" create secret docker-registry github-container-registry \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_PULL_USER" \
              --docker-password="$GHCR_PULL_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::GHCR_PULL_TOKEN is not set: the image must be public."
            # Stale credentials would make GHCR answer 403 even for a public image
            kubectl -n "$NAMESPACE" create secret generic github-container-registry \
              --type=kubernetes.io/dockerconfigjson \
              --from-literal=.dockerconfigjson='{"auths":{}}' \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Application settings (GitHub Variables)
        env:
          PUBLIC_SITE_URL: ${{ vars[format('{0}_PUBLIC_SITE_URL', inputs.prefix)] }}
          CORS_ORIGIN: ${{ vars[format('{0}_CORS_ORIGIN', inputs.prefix)] }}
        run: |
          args=()
          for name in PUBLIC_SITE_URL CORS_ORIGIN; do
            if [ -n "${!name}" ]; then
              args+=(--from-literal="$name=${!name}")
            fi
          done
          kubectl -n "$NAMESPACE" create configmap "$APP-app-config" "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Application secrets (GitHub Secrets)
        env:
          DB_USER: ${{ secrets[format('{0}_DB_USER', inputs.prefix)] }}
          DB_PASSWORD: ${{ secrets[format('{0}_DB_PASSWORD', inputs.prefix)] }}
          JWT_SECRET: ${{ secrets[format('{0}_JWT_SECRET', inputs.prefix)] }}
          MYSQL_ROOT_PASSWORD: ${{ secrets[format('{0}_MYSQL_ROOT_PASSWORD', inputs.prefix)] }}
          ADMIN_INITIAL_EMAIL: ${{ secrets[format('{0}_ADMIN_INITIAL_EMAIL', inputs.prefix)] }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets[format('{0}_ADMIN_INITIAL_PASSWORD', inputs.prefix)] }}
        run: |
          missing=0
          for name in DB_USER DB_PASSWORD JWT_SECRET MYSQL_ROOT_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${PREFIX}_$name is required"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

          # Application: database credentials, JWT key, optional first admin
          args=(--from-literal="DB_USER=$DB_USER" --from-literal="DB_PASSWORD=$DB_PASSWORD"
                --from-literal="JWT_SECRET=$JWT_SECRET")
          for name in ADMIN_INITIAL_EMAIL ADMIN_INITIAL_PASSWORD; do
            if [ -n "${!name}" ]; then
              args+=(--from-literal="$name=${!name}")
            fi
          done
          kubectl -n "$NAMESPACE" create secret generic "$APP-app" "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Database: root and application user (only used when the data
          # directory is initialized)
          kubectl -n "$NAMESPACE" create secret generic "$APP-db" \
            --from-literal="MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" \
            --from-literal="MYSQL_USER=$DB_USER" \
            --from-literal="MYSQL_PASSWORD=$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        env:
          TAG: ${{ github.sha }}
        run: |
          # Image of the deployed commit (portable sed: same syntax on Linux and macOS).
          # Quoted: a SHA made of digits (or like "8e1234...") would otherwise be read as a number.
          sed "s/^\([[:space:]]*newTag:\).*/\1 \"${TAG}\"/" "$MANIFESTS/kustomization.yaml" > "$RUNNER_TEMP/kustomization.yaml"
          mv "$RUNNER_TEMP/kustomization.yaml" "$MANIFESTS/kustomization.yaml"
          kubectl apply -k "$MANIFESTS"
          # Database first, then the web pod
          kubectl -n "$NAMESPACE" rollout status "deployment/$APP-db" --timeout=600s
          kubectl -n "$NAMESPACE" rollout status "deployment/$APP-web" --timeout=600s

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get deployments,pods,services,pvc,ingress || true
          kubectl -n "$NAMESPACE" describe pods -l app.kubernetes.io/name=pool-tracker || true
          for component in web database; do
            echo "--- logs: $component"
            kubectl -n "$NAMESPACE" logs -l "app.kubernetes.io/component=$component" --tail=100 --all-containers || true
          done
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -30 || true

      - name: Smoke tests on the public site
        env:
          SITE: ${{ vars[format('{0}_PUBLIC_SITE_URL', inputs.prefix)] }}
        run: |
          if [ -z "$SITE" ]; then
            echo "::warning::Variable ${PREFIX}_PUBLIC_SITE_URL is not set: no smoke tests"
            exit 0
          fi
          # Through the ingress, like a visitor: DNS, TLS, nginx, Node, database
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 -o /dev/null "$SITE/api/health"; then
              break
            fi
            [ "$attempt" = 12 ] && { echo "::error::$SITE/api/health does not answer"; exit 1; }
            sleep 10
          done
          fail=0
          # Each check retries: right after a rollout, the ingress may still send a
          # request to the old pod while it stops
          check() {
            code=000
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE$1" || true)
              [ "$code" = "$2" ] && break
              sleep 3
            done
            if [ "$code" = "$2" ]; then
              echo "✅ $1 -> $code"
            else
              echo "::error::$1 answered $code, expected $2"
              fail=1
            fi
          }
          check / 200
          check /api/health 200
          check /api/auth/profile 401   # unauthenticated request is refused
          if ! curl -sI --max-time 10 "$SITE/" | grep -qi '^strict-transport-security:'; then
            echo "::error::Strict-Transport-Security header missing"
            fail=1
          fi
          exit "$fail"
