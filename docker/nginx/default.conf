# HTTP server (redirect to HTTPS if certificates are available)
server {
    listen 80;
    server_name localhost pool.nice-tek.eu www.pool.nice-tek.eu;

    # Check if TLS certificate exists, if so redirect to HTTPS
    location = /ssl-check {
        access_log off;
        return 200 "SSL Ready\n";
        add_header Content-Type text/plain;
    }

    # Serve React app
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Security headers for API
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
    }
}

# HTTPS server (only if certificate files exist)
server {
    listen 443 ssl http2;
    server_name localhost pool.nice-tek.eu www.pool.nice-tek.eu;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/tls.crt;
    ssl_certificate_key /etc/ssl/private/tls.key;
    
    # Include SSL configuration from mounted config
    include /etc/ssl/config/ssl.conf;
    
    # Additional SSL security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Serve React app
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Enhanced security headers for HTTPS
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Proxy API requests to Node.js backend with SSL
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        
        # Enhanced security headers for API over HTTPS
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SSL health check endpoint
    location = /ssl-health {
        access_log off;
        return 200 "SSL OK\n";
        add_header Content-Type text/plain;
    }
}
