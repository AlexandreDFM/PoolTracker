apiVersion: apps/v1
kind: Deployment
metadata:
    name: pool-tracker-deployment-prod
    namespace: pool-tracker-prod
    labels:
        app: pool-tracker
        environment: pool-tracker-prod

spec:
    replicas: 1
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 1
            maxSurge: 2
    selector:
        matchLabels:
            app: pool-tracker
    template:
        metadata:
            labels:
                app: pool-tracker
                environment: pool-tracker-prod
        spec:
            terminationGracePeriodSeconds: 30
            containers:
                - name: pool-tracker
                  image: ghcr.io/alexandredfm/pool-tracker:latest
                  ports:
                      - containerPort: 80
                        name: http
                        protocol: TCP
                      - containerPort: 3001
                        name: api
                        protocol: TCP
                  env:
                      - name: NODE_ENV
                        value: "production"
                      - name: PORT
                        value: "3001"
                      - name: DB_HOST
                        valueFrom:
                            configMapKeyRef:
                                name: pool-tracker-config-prod
                                key: DB_HOST
                      - name: DB_USER
                        valueFrom:
                            secretKeyRef:
                                name: pool-tracker-secret-prod
                                key: DB_USER
                      - name: DB_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: pool-tracker-secret-prod
                                key: DB_PASSWORD
                      - name: DB_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: pool-tracker-config-prod
                                key: DB_NAME
                      - name: JWT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: pool-tracker-secret-prod
                                key: JWT_SECRET
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 80
                      initialDelaySeconds: 30
                      periodSeconds: 30
                      timeoutSeconds: 10
                      successThreshold: 1
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 80
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 5
                      successThreshold: 1
                      failureThreshold: 3
                  startupProbe:
                      httpGet:
                          path: /
                          port: 80
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 3
                      successThreshold: 1
                      failureThreshold: 15
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "100m"
                      limits:
                          memory: "512Mi"
                          cpu: "300m"
            imagePullSecrets:
                - name: github-container-registry
