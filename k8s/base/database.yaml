# MySQL: one replica on a ReadWriteOnce volume (Recreate strategy).
# local-path-retain: deleting the PVC keeps the data directory on the node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pool-tracker-db-data
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool-tracker-db
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: database
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pool-tracker
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pool-tracker
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.0.35
          envFrom:
            # MYSQL_ROOT_PASSWORD, MYSQL_USER, MYSQL_PASSWORD (GitHub Secrets).
            # They only act when the data directory is initialized.
            - secretRef:
                name: pool-tracker-db
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: pool-tracker-config
                  key: DB_NAME
          args:
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
            - "--default-authentication-plugin=mysql_native_password"
            - "--innodb-buffer-pool-size=256M"
            - "--max-connections=200"
            # Prevent MySQL from closing idle pool connections (default is 28800s = 8h).
            - "--wait_timeout=86400"
            - "--interactive_timeout=86400"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pool-tracker-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: pool-tracker-db
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
