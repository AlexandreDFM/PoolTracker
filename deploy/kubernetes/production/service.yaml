apiVersion: v1
kind: Service
metadata:
    name: pool-tracker-service-prod
    namespace: pool-tracker-prod
    labels:
        app: pool-tracker
        environment: production
    annotations:
        description: "Production service for PoolTracker application"
spec:
    type: ClusterIP
    selector:
        app: pool-tracker
        environment: pool-tracker-prod
    ports:
        - name: http
          protocol: TCP
          port: 80
          # Named port: 8080 in the current image (80 in older pods during a rollout)
          targetPort: http
        - name: api
          protocol: TCP
          port: 3001
          targetPort: 3001
