# Daily database dump to a dedicated volume, 14 days kept.
# Restore and download: scripts/kube-db-manager.sh and scripts/kube-db-local.sh.
# There is no copy off the server.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pool-tracker-backups
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pool-tracker-db-backup
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: backup
spec:
  schedule: "0 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pool-tracker
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: mysql:8.4.13
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: pool-tracker-db
                      key: MYSQL_ROOT_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: pool-tracker-config
                      key: DB_NAME
                - name: RETENTION_DAYS
                  value: "14"
              command:
                - sh
                - -ec
                - |
                  STAMP=$(date -u +%Y%m%d_%H%M%S)
                  FILE="/backups/${DB_NAME}_${STAMP}.sql.gz"
                  mysqldump -h pool-tracker-db -u root \
                    --single-transaction --routines --triggers --events \
                    --databases "$DB_NAME" | gzip > "$FILE.tmp"
                  # A complete dump ends with this line; keep nothing else
                  gzip -dc "$FILE.tmp" | tail -1 | grep -q "Dump completed" \
                    || { echo "incomplete dump"; rm -f "$FILE.tmp"; exit 1; }
                  mv "$FILE.tmp" "$FILE"
                  echo "dump: $FILE ($(du -h "$FILE" | cut -f1))"
                  find /backups -name '*.sql.gz' -mtime +"$RETENTION_DAYS" -print -delete
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pool-tracker-backups
