name: Complete Production Deployment Pipeline

env:
    # GitHub Configuration
    GITHUB_USERNAME: ${{ github.repository_owner }}
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Kubernetes Configuration
    KUBERNETES_URL: ${{ secrets.KUBERNETES_URL }}
    KUBERNETES_SECRET: ${{ secrets.KUBERNETES_SECRET }}

    # Container Registry
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/pool-tracker

    # Production Database Secrets
    DB_USER: ${{ secrets.DB_USER }}
    DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    JWT_SECRET: ${{ secrets.JWT_SECRET }}
    SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

on:
    push:
        branches:
            - main
            - feature/deploy-prod
        tags:
            - 'v*.*.*'

    # Manual trigger
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to deploy to'
                required: true
                default: 'production'
                type: choice
                options:
                    - production
                    - staging
            force_redeploy:
                description: 'Force complete redeployment'
                type: boolean
                default: false

jobs:
    # Build and push Docker image
    build:
        name: Build & Push Docker Image
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.meta.outputs.tags }}
            image_digest: ${{ steps.build.outputs.digest }}
            image_version: ${{ steps.meta.outputs.version }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ env.GITHUB_USERNAME }}
                  password: ${{ env.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              id: build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NODE_ENV=production

    # Deploy to Kubernetes
    deploy:
        name: Deploy to Production Kubernetes
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/deploy-prod' || startsWith(github.ref, 'refs/tags/v')
        environment:
            name: production
            url: https://pool-tracker.alexandredfm.fr
        concurrency:
            group: production-deployment
            cancel-in-progress: false
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Kubernetes context
              uses: azure/k8s-set-context@v4
              with:
                  method: service-account
                  k8s-url: ${{ env.KUBERNETES_URL }}
                  k8s-secret: ${{ env.KUBERNETES_SECRET }}

            - name: Create/Update Namespace
              run: kubectl apply -f deploy/kubernetes/namespaces.yaml

            - name: Create Production Secrets
              uses: Azure/k8s-create-secret@v4
              with:
                  namespace: pool-tracker-prod
                  secret-type: generic
                  secret-name: pool-tracker-secret-prod
                  data: |
                      DB_USER=${{ env.DB_USER }}
                      DB_PASSWORD=${{ env.DB_PASSWORD }}
                      JWT_SECRET=${{ env.JWT_SECRET }}
                      SESSION_SECRET=${{ env.SESSION_SECRET }}

            - name: Create Container Registry Secret
              uses: Azure/k8s-create-secret@v4
              with:
                  namespace: pool-tracker-prod
                  secret-type: docker-registry
                  secret-name: github-container-registry
                  container-registry-url: ${{ env.REGISTRY }}
                  container-registry-username: ${{ env.GITHUB_USERNAME }}
                  container-registry-password: ${{ env.GITHUB_TOKEN }}

            - name: Apply ConfigMap
              run: kubectl apply -f deploy/kubernetes/production/configmap.yaml

            - name: Deploy Database
              run: |
                  if ! kubectl get deployment pool-tracker-db-deployment-prod -n pool-tracker-prod >/dev/null 2>&1; then
                      kubectl apply -f deploy/kubernetes/production/database.yaml
                      kubectl wait --for=condition=available --timeout=300s deployment/pool-tracker-db-deployment-prod -n pool-tracker-prod
                  fi

            - name: Deploy Application
              uses: azure/k8s-deploy@v5
              with:
                  action: deploy
                  strategy: basic
                  namespace: pool-tracker-prod
                  manifests: |
                      deploy/kubernetes/production/deployment.yaml
                      deploy/kubernetes/production/service.yaml
                      deploy/kubernetes/production/ingress.yaml
                  images: |
                      ghcr.io/alexandredfm/pool-tracker:${{ github.sha }}
                  imagepullsecrets: |
                      github-container-registry

            - name: Verify Deployment
              run: |
                  echo "=== Deployment Status ==="
                  kubectl get all -n pool-tracker-prod
                  kubectl wait --for=condition=ready --timeout=300s pod -l app=pool-tracker -n pool-tracker-prod

    # Cleanup on failure
    cleanup-on-failure:
        name: Cleanup Failed Deployment
        runs-on: ubuntu-latest
        needs: [build, deploy]
        if: failure() && inputs.force_redeploy
        steps:
            - name: Set up Kubernetes context
              uses: azure/k8s-set-context@v4
              with:
                  method: service-account
                  k8s-url: ${{ env.KUBERNETES_URL }}
                  k8s-secret: ${{ env.KUBERNETES_SECRET }}

            - name: Gather Debug Information
              run: |
                  echo "=== Debug Information ==="
                  kubectl get all -n pool-tracker-prod
                  kubectl describe pods -n pool-tracker-prod
                  kubectl logs -l app=pool-tracker -n pool-tracker-prod --tail=100 || true
                  kubectl get events -n pool-tracker-prod --sort-by=.metadata.creationTimestamp

            - name: Rollback if needed
              if: inputs.force_redeploy == false
              run: |
                  echo "Attempting rollback..."
                  kubectl rollout undo deployment/pool-tracker-deployment-prod -n pool-tracker-prod || true
