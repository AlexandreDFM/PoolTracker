# HTTP server
server {
    # Unprivileged port: the container does not run as root
    listen 8080 default_server;
    server_name localhost pool.nice-tek.eu www.pool.nice-tek.eu;

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Serve React app
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Content Security Policy - Allow Google Fonts and blob for object URLs
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-src 'self' blob: https://docs.google.com; child-src 'self' blob: https://docs.google.com; worker-src 'self' blob:;" always;
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        # Node logs the API requests itself
        access_log off;
        # Node runs in the other container of the pod (same network namespace)
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Security headers for API
        add_header X-Content-Type-Options nosniff always;
        # Keep X-Frame-Options DENY for API responses (not used for blob object URLs)
        add_header X-Frame-Options DENY always;
    }
}

