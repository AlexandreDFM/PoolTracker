services:
  # Static production image containing both frontend and backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"      # Nginx frontend
      - "3001:3001"  # Node.js backend API
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pool-tracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8.0.35
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-pool_tracker_prod}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - pool-tracker-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Production-like database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=${PMA_USER:-root}
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - PMA_ABSOLUTE_URI=${PMA_ABSOLUTE_URI:-http://localhost:8080}
      - UPLOAD_LIMIT=256M
      - MEMORY_LIMIT=256M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pool-tracker-network

  # Production monitoring and logging
  nginx-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - pool-tracker-network
    profiles:
      - ssl

networks:
  pool-tracker-network:
    driver: bridge
    name: pool-tracker-prod-network

volumes:
  mysql_prod_data:
    driver: local
    name: pool-tracker-mysql-prod-data
