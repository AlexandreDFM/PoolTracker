apiVersion: v1
kind: ConfigMap
metadata:
    name: pool-tracker-config-prod
    namespace: pool-tracker-prod
    labels:
        app: pool-tracker
        environment: production
    annotations:
        description: "Production configuration for PoolTracker application"
data:
    # Database configuration (non-sensitive)
    DB_HOST: "pool-tracker-db-service-prod"
    DB_NAME: "pool_tracker_prod"

    # Application configuration
    NODE_ENV: "production"

    # Logging configuration
    LOG_LEVEL: "info"
    LOG_FORMAT: "json"

    # CORS configuration
    CORS_ORIGIN: "https://pool-tracker.alexandredfm.fr,https://www.pool-tracker.alexandredfm.fr"

    # Rate limiting
    RATE_LIMIT_WINDOW_MS: "900000"  # 15 minutes
    RATE_LIMIT_MAX_REQUESTS: "100"

    # Session configuration
    SESSION_NAME: "pool-tracker-session"
    SESSION_SECURE: "true"
    SESSION_HTTP_ONLY: "true"
    SESSION_SAME_SITE: "strict"
