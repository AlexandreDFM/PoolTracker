# PoolTracker web pod, one image and two containers:
# - web: nginx serves the client build and proxies /api to 127.0.0.1:3001
# - api: Node (Express), schema migrations at start, quest scheduler
# Each container has its own probes, so Kubernetes restarts whichever dies.
# Several replicas are safe: migrations and the daily quest assignment run
# under MySQL locks (login delays and the quest PDF cache stay per pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool-tracker-web
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pool-tracker
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pool-tracker
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 30
      # Created by the workflow from GHCR_PULL_TOKEN; ignored when missing
      imagePullSecrets:
        - name: github-container-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The server runs its migrations at startup and exits if MySQL does not
      # answer: wait for the database first
      initContainers:
        - name: wait-for-database
          image: mysql:8.4.13
          command:
            - sh
            - -c
            - |
              until MYSQL_PWD="$DB_PASSWORD" mysql -h "$DB_HOST" -u "$DB_USER" -e "SELECT 1" "$DB_NAME" > /dev/null 2>&1; do
                echo "waiting for $DB_HOST"; sleep 3
              done
          envFrom:
            - configMapRef:
                name: pool-tracker-config
            - secretRef:
                name: pool-tracker-app
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: web
          image: ghcr.io/epitech-nice/pool-tracker:latest   # tag replaced by the commit SHA on deploy
          # Tags are commit SHAs (immutable): no need to pull again
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-e", "stderr", "-g", "daemon off;"]
          # Read-only image: nginx writes only its pid and temp files under
          # /tmp (large proxied responses such as the quest PDF included); its
          # logs go to the container output
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: web-tmp
              mountPath: /tmp
          # Leave time for the ingress to stop sending requests before nginx
          # stops (no cut connection during a rollout)
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 8080
          # nginx itself; the API and the database are checked by the api container
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: api
          image: ghcr.io/epitech-nice/pool-tracker:latest   # tag replaced by the commit SHA on deploy
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pool-tracker-config        # constants, in git
            - configMapRef:
                name: pool-tracker-app-config    # GitHub Variables
                optional: true
            - secretRef:
                name: pool-tracker-app           # GitHub Secrets
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-tmp
              mountPath: /tmp
          # nginx stops sending /api requests first (see the web container)
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: api
              containerPort: 3001
          # Startup and liveness: Node answers (no database, so a database
          # outage does not restart the app in a loop).
          # Readiness: the database answers too.
          startupProbe:
            httpGet:
              path: /api/health/live
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: web-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: api-tmp
          emptyDir:
            sizeLimit: 64Mi
