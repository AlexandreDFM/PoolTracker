---
# HTTP to HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pool-tracker-ingress-redirect-prod
  namespace: pool-tracker-prod
  labels:
    app: pool-tracker
    environment: production
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pool.nice-tek.eu`) || Host(`www.pool.nice-tek.eu`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: pool-tracker-service-prod
          port: 80

---
# HTTPS ingress
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pool-tracker-ingress-prod
  namespace: pool-tracker-prod
  labels:
    app: pool-tracker
    environment: production
  annotations:
    description: "Production ingress for PoolTracker application"
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: le
    domains:
      - main: pool.nice-tek.eu
        sans:
          - www.pool.nice-tek.eu
  routes:
    - match: Host(`pool.nice-tek.eu`) || Host(`www.pool.nice-tek.eu`)
      kind: Rule
      middlewares:
        - name: security-headers
        - name: rate-limit
      services:
        - name: pool-tracker-service-prod
          port: 80

---
# Redirect middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: pool-tracker-prod
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# Security headers middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: pool-tracker-prod
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    customResponseHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "DENY"
      X-XSS-Protection: "1; mode=block"
      Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'"

---
# Rate limiting middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: pool-tracker-prod
spec:
  rateLimit:
    burst: 100
    average: 50

