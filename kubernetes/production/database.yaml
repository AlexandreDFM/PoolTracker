---
# Persistent Volume Claim for MySQL data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: mysql-data-pvc-prod
    namespace: pool-tracker-prod
    labels:
        app: mysql
        environment: production
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 20Gi
    storageClassName: fast-ssd  # Adjust based on your cluster's storage classes

---
# MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: pool-tracker-db-deployment-prod
    namespace: pool-tracker-prod
    labels:
        app: mysql
        environment: production
spec:
    replicas: 1
    strategy:
        type: Recreate  # MySQL can't have multiple replicas without clustering
    selector:
        matchLabels:
            app: mysql
            environment: production
    template:
        metadata:
            labels:
                app: mysql
                environment: production
        spec:
            containers:
                - name: mysql
                  image: mysql:8.0.35
                  ports:
                      - containerPort: 3306
                        name: mysql
                        protocol: TCP
                  env:
                      - name: MYSQL_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: pool-tracker-secret-prod
                                key: DB_PASSWORD
                      - name: MYSQL_DATABASE
                        valueFrom:
                            configMapKeyRef:
                                name: pool-tracker-config-prod
                                key: DB_NAME
                      - name: MYSQL_USER
                        valueFrom:
                            secretKeyRef:
                                name: pool-tracker-secret-prod
                                key: DB_USER
                      - name: MYSQL_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: pool-tracker-secret-prod
                                key: DB_PASSWORD
                  args:
                      - "--character-set-server=utf8mb4"
                      - "--collation-server=utf8mb4_unicode_ci"
                      - "--default-authentication-plugin=mysql_native_password"
                      - "--innodb-buffer-pool-size=256M"
                      - "--max-connections=200"
                  volumeMounts:
                      - name: mysql-data
                        mountPath: /var/lib/mysql
                  livenessProbe:
                      exec:
                          command:
                              - mysqladmin
                              - ping
                              - -h
                              - localhost
                      initialDelaySeconds: 30
                      periodSeconds: 30
                      timeoutSeconds: 10
                      successThreshold: 1
                      failureThreshold: 3
                  readinessProbe:
                      exec:
                          command:
                              - mysql
                              - -h
                              - localhost
                              - -u
                              - root
                              - -p${MYSQL_ROOT_PASSWORD}
                              - -e
                              - "SELECT 1"
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 5
                      successThreshold: 1
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: "512Mi"
                          cpu: "200m"
                      limits:
                          memory: "1Gi"
                          cpu: "500m"
            volumes:
                - name: mysql-data
                  persistentVolumeClaim:
                      claimName: mysql-data-pvc-prod
            securityContext:
                runAsUser: 999
                runAsGroup: 999
                fsGroup: 999

---
# MySQL Service
apiVersion: v1
kind: Service
metadata:
    name: pool-tracker-db-service-prod
    namespace: pool-tracker-prod
    labels:
        app: mysql
        environment: production
spec:
    type: ClusterIP
    selector:
        app: mysql
        environment: production
    ports:
        - name: mysql
          protocol: TCP
          port: 3306
          targetPort: 3306
