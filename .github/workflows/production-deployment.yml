name: Complete Production Deployment Pipeline

# Secrets are only read through step env: and quoted shell variables, never
# interpolated into run: scripts.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pool-tracker
  NAMESPACE: pool-tracker-prod
  SITE_URL: https://pool.nice-tek.eu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Build and push Docker image
  build:
    name: Build & Push Docker Image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Verify Image Build
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image digest: $IMAGE_DIGEST"
          echo "🏷️ Image tags: $IMAGE_TAGS"
          echo ""
          echo "The following image will be deployed:"
          echo "$REGISTRY/$IMAGE_NAME:latest"

  # Deploy to Kubernetes
  # One-time setup by a cluster admin (namespace, deploy account, cert-manager
  # and its ClusterIssuer): see documentation/KUBERNETES-PRODUCTION-DEPLOYMENT.md
  deploy:
    name: Deploy to Production Kubernetes
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://pool.nice-tek.eu
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to the cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
              echo "::error::Secret KUBE_CONFIG is missing (deploy/kubernetes/rbac/make-kubeconfig.sh)"
              exit 1
          fi
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          KUBECONFIG="$kubeconfig" kubectl -n "$NAMESPACE" auth can-i create deployments.apps \
              || { echo "::error::The deploy account cannot deploy in $NAMESPACE (deploy/kubernetes/rbac/deployer.yaml)"; exit 1; }

      - name: Create Production Secrets
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          kubectl create secret generic pool-tracker-secret-prod -n "$NAMESPACE" \
              --from-literal=DB_USER="$DB_USER" \
              --from-literal=DB_PASSWORD="$DB_PASSWORD" \
              --from-literal=JWT_SECRET="$JWT_SECRET" \
              --from-literal=SESSION_SECRET="$SESSION_SECRET" \
              --dry-run=client -o yaml | kubectl apply -f -

      - name: Registry access (private package only)
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER || github.repository_owner }}
        run: |
          # The pull secret must outlive the workflow run: the kubelet pulls again
          # whenever a pod is recreated (node reboot, eviction). GITHUB_TOKEN expires
          # when the job ends, so a long-lived read:packages token is required.
          if [ -n "$GHCR_PULL_TOKEN" ]; then
              kubectl create secret docker-registry github-container-registry -n "$NAMESPACE" \
                  --docker-server="$REGISTRY" \
                  --docker-username="$GHCR_PULL_USER" \
                  --docker-password="$GHCR_PULL_TOKEN" \
                  --dry-run=client -o yaml | kubectl apply -f -
          else
              echo "::warning::GHCR_PULL_TOKEN is not set: the image must be public."
              # Overwrite any stale credentials, which would make GHCR answer 403 even for a public image.
              kubectl create secret generic github-container-registry -n "$NAMESPACE" \
                  --type=kubernetes.io/dockerconfigjson \
                  --from-literal=.dockerconfigjson='{"auths":{}}' \
                  --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Apply ConfigMap
        run: kubectl apply -f deploy/kubernetes/production/configmap.yaml

      - name: Deploy Database
        run: |
          echo "Deploying database components..."

          # Check if PVC exists and has conflicting configuration
          if kubectl get pvc mysql-data-pvc-prod -n "$NAMESPACE" >/dev/null 2>&1; then
              CURRENT_STORAGE_CLASS=$(kubectl get pvc mysql-data-pvc-prod -n "$NAMESPACE" -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "")
              CURRENT_STORAGE_SIZE=$(kubectl get pvc mysql-data-pvc-prod -n "$NAMESPACE" -o jsonpath='{.spec.resources.requests.storage}' 2>/dev/null || echo "")
              echo "Found existing PVC with storage class: '$CURRENT_STORAGE_CLASS', size: '$CURRENT_STORAGE_SIZE'"

              # PVC specs are immutable. Never delete the volume from CI: it holds the
              # production data. A storage change is a manual migration (backup, restore).
              if [ "$CURRENT_STORAGE_CLASS" != "local-path" ] || [ "$CURRENT_STORAGE_SIZE" != "10Gi" ]; then
                  echo "::error::PVC mismatch. Current: $CURRENT_STORAGE_CLASS/$CURRENT_STORAGE_SIZE, manifest: local-path/10Gi. Migrate the volume manually (scripts/kube-db-manager.sh backup, then restore)."
                  exit 1
              else
                  echo "PVC configuration is correct."
              fi
          else
              echo "No existing PVC found. Proceeding with fresh deployment..."
          fi

          # Deploy database components
          kubectl apply -f deploy/kubernetes/production/database.yaml

          # Wait for database to be ready with appropriate timeout
          echo "Waiting for database to be ready (this may take several minutes for MySQL initialization)..."
          if ! kubectl wait --for=condition=ready --timeout=600s pod -l app=mysql -n "$NAMESPACE"; then
              echo "Database deployment timed out, checking status..."
              kubectl get pods -l app=mysql -n "$NAMESPACE"
              kubectl describe pods -l app=mysql -n "$NAMESPACE"
              kubectl logs -l app=mysql -n "$NAMESPACE" --tail=100 || echo "No logs available"
              exit 1
          fi

          echo "Database is ready!"

      - name: Deploy Application
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          echo "Deploying application with image: $REGISTRY/$IMAGE_NAME:latest"
          echo "Build digest: $IMAGE_DIGEST"

          # Apply Kubernetes manifests. The TLS certificate is created and renewed by
          # cert-manager from the cluster-issuer annotation of the Ingress.
          kubectl apply -f deploy/kubernetes/production/deployment.yaml
          kubectl apply -f deploy/kubernetes/production/service.yaml
          kubectl apply -f deploy/kubernetes/production/ingress.yaml

          # The image tag is always 'latest': restart so the new image is pulled
          kubectl rollout restart deployment/pool-tracker-deployment-prod -n "$NAMESPACE"

      - name: Verify Rollout
        run: |
          echo "⏳ Waiting for deployment rollout..."

          if ! kubectl rollout status deployment/pool-tracker-deployment-prod -n "$NAMESPACE" --timeout=600s; then
              echo "❌ Rollout failed! Gathering debug information..."

              echo ""
              echo "=== Deployment Description ==="
              kubectl describe deployment pool-tracker-deployment-prod -n "$NAMESPACE"

              echo ""
              echo "=== Pod Status ==="
              kubectl get pods -n "$NAMESPACE" -l app=pool-tracker

              echo ""
              echo "=== Pod Descriptions ==="
              kubectl describe pods -n "$NAMESPACE" -l app=pool-tracker

              echo ""
              echo "=== Pod Logs (if available) ==="
              for pod in $(kubectl get pods -n "$NAMESPACE" -l app=pool-tracker -o name 2>/dev/null); do
                  echo "--- Logs from $pod ---"
                  kubectl logs "$pod" -n "$NAMESPACE" --tail=100 --all-containers=true || echo "Could not fetch logs for $pod"
                  echo ""
              done

              echo ""
              echo "=== Recent Events ==="
              kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -20

              exit 1
          fi

          echo "✅ Deployment rolled out successfully!"

      - name: Verify Deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments,pods,services,pvc -n "$NAMESPACE"

          echo ""
          echo "=== SSL Certificate Status ==="
          if kubectl get certificate pool-tracker-tls-cert -n "$NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep -q "True"; then
              echo "✅ SSL Certificate is ready, expires: $(kubectl get certificate pool-tracker-tls-cert -n "$NAMESPACE" -o jsonpath='{.status.notAfter}')"
          else
              echo "::warning::SSL certificate is not ready yet (cert-manager issues it from the Ingress annotation)."
              kubectl get certificate,certificaterequests,challenges -n "$NAMESPACE" || true
          fi

      - name: Smoke tests
        run: |
          # Through the public URL: DNS, Traefik, TLS, nginx and the Node backend
          fail=0
          check() {
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 --retry 5 --retry-delay 5 --retry-all-errors "$SITE_URL$1" || true)
              if [ "$code" = "$2" ]; then
                  echo "✅ $1 -> $code"
              else
                  echo "::error::$1 answered $code, expected $2"
                  fail=1
              fi
          }
          check /health 200
          check / 200
          check /api/health 200         # Node and the database answer
          check /api/auth/profile 401   # unauthenticated request is refused
          if ! curl -sI --max-time 15 "$SITE_URL/" | grep -qi '^strict-transport-security:'; then
              echo "::error::Strict-Transport-Security header missing"
              fail=1
          fi
          exit "$fail"
