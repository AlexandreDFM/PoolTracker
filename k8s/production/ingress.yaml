# pool.nice-tek.eu, TLS by cert-manager (Let's Encrypt HTTP-01) from the
# annotation. The certificate also covers www, which redirects to the apex.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pool-tracker-web
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: pool-tracker-prod-redirect-https@kubernetescrd,pool-tracker-prod-security-headers@kubernetescrd,pool-tracker-prod-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pool.nice-tek.eu
        - www.pool.nice-tek.eu
      secretName: pool-tracker-tls-cert
  rules:
    - host: pool.nice-tek.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pool-tracker-web
                port:
                  name: http
---
# www.pool.nice-tek.eu -> https://pool.nice-tek.eu (same certificate)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pool-tracker-web-www
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: pool-tracker-prod-redirect-www@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.pool.nice-tek.eu
      secretName: pool-tracker-tls-cert
  rules:
    - host: www.pool.nice-tek.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pool-tracker-web
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www
  labels:
    app.kubernetes.io/name: pool-tracker
    app.kubernetes.io/component: web
spec:
  redirectRegex:
    regex: ^https?://www\.pool\.nice-tek\.eu(:[0-9]+)?/(.*)
    replacement: https://pool.nice-tek.eu/${2}
    permanent: true
