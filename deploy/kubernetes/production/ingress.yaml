---
# Updated Ingress for Let's Encrypt SSL
# This ingress supports automatic SSL certificate generation via Let's Encrypt

# HTTP to HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pool-tracker-ingress-redirect-prod
  namespace: pool-tracker-prod
  labels:
    app: pool-tracker
    environment: production
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pool.nice-tek.eu`) || Host(`www.pool.nice-tek.eu`)
      kind: Rule
      services:
        - name: pool-tracker-service-prod
          port: 80
      middlewares:
        - name: redirect-to-https

---
# Main HTTPS Ingress with Let's Encrypt
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pool-tracker-ingress-prod
  namespace: pool-tracker-prod
  labels:
    app: pool-tracker
    environment: production
  annotations:
    # Let's Encrypt certificate issuer
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Alternative: Use staging for testing
    # cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pool.nice-tek.eu`) || Host(`www.pool.nice-tek.eu`)
      kind: Rule
      services:
        - name: pool-tracker-service-prod
          port: 80
      middlewares:
        - name: security-headers
        - name: rate-limit
  # TLS configuration with Let's Encrypt
  tls:
    secretName: pool-tracker-tls-cert
    domains:
      - main: pool.nice-tek.eu
        sans:
          - www.pool.nice-tek.eu

---
# Traditional Kubernetes Ingress (alternative approach)
# Use this if you prefer standard Kubernetes ingress over Traefik IngressRoute
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pool-tracker-ingress-k8s-prod
  namespace: pool-tracker-prod
  labels:
    app: pool-tracker
    environment: production
  annotations:
    # Let's Encrypt annotations
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: http01

    # Traefik annotations
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: pool-tracker-prod-redirect-to-https@kubernetescrd,pool-tracker-prod-security-headers@kubernetescrd

    # SSL redirect
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pool.nice-tek.eu
    - www.pool.nice-tek.eu
    secretName: pool-tracker-tls-cert
  rules:
  - host: pool.nice-tek.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pool-tracker-service-prod
            port:
              number: 80
  - host: www.pool.nice-tek.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pool-tracker-service-prod
            port:
              number: 80

---
# Middleware for HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: pool-tracker-prod
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# Security headers middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: pool-tracker-prod
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    customResponseHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "SAMEORIGIN"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
    contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-src 'self' blob:; child-src 'self' blob:; worker-src 'self' blob;"
    forceSTSHeader: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true

---
# Rate limiting middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: pool-tracker-prod
spec:
  rateLimit:
    average: 100
    period: 1s
    burst: 50
